name: Feature request
description: An idea or a missing feature
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The situation or problem, before the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Anything else?
      description: Broker or platform, alternatives you tried, whether you would work on it yourself.
