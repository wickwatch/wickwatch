packages:
  - apps/*
  - packages/*

catalog:
  typescript: ^6.0.3
  "@types/node": ^24.19.2
  vitest: ^5.1.2

allowBuilds:
  # Ships prebuilt binaries; building from source is not needed.
  better-sqlite3: false
  # Optional SSH transport of dockerode; wickwatch talks to docker-socket-proxy over TCP.
  cpu-features: false
  ssh2: false
  # Only a version check after install.
  protobufjs: false
  esbuild: true

minimumReleaseAgeExclude:
  - '@vitest/coverage-v8@5.1.2'
  - '@vitest/mocker@5.1.2'
  - '@vitest/spy@5.1.2'
  - vitest@5.1.2
