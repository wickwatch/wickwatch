packages:
  - apps/*
  - packages/*

catalog:
  typescript: ^6.0.3
  "@types/node": ^24.0.0
  vitest: ^5.0.2

allowBuilds:
  # Ships prebuilt binaries; building from source is not needed.
  better-sqlite3: false
  cpu-features: set this to true or false
  esbuild: true
  protobufjs: set this to true or false
  ssh2: set this to true or false
