packages:
  - apps/*
  - packages/*

catalog:
  typescript: ^6.0.3
  "@types/node": ^24.19.1
  vitest: ^5.0.2

allowBuilds:
  # Ships prebuilt binaries; building from source is not needed.
  better-sqlite3: false
  # Optional SSH transport of dockerode; wickwatch talks to docker-socket-proxy over TCP.
  cpu-features: false
  ssh2: false
  # Only a version check after install.
  protobufjs: false
  esbuild: true
